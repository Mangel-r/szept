</style></head><body><main><a href="./index.html">← Powrót do SZEPTU</a><h1>Szept na dziś</h1><p>Odnajdź słowa, których potrzebuje dziś Twoja dusza…</p><div class="cards"><button data-kind="0"><img src="slowo.jpg" alt=""><span>Słowo dnia</span></button><button data-kind="1"><img src="afirmacja.jpg" alt=""><span>Afirmacja</span></button><button data-kind="2"><img src="literatura.jpg" alt=""><span>Szept literatury</span></button></div><article class="paper" aria-live="polite"><h2 id="heading">Otwórz kartę</h2><p id="message">Niektóre słowa odnajdują nas dokładnie wtedy, kiedy najbardziej ich potrzebujemy.</p><div id="author"></div></article><div class="actions" id="actions" hidden><button id="copy">Kopiuj słowa</button><a id="share" target="_blank" rel="noopener noreferrer">Udostępnij na Facebooku</a></div><p id="status" role="status"></p><footer>SZEPT — Twoje słowa. Czyjeś emocje.</footer></main><script>
const data=[[
['Nadzieja','Nawet najmniejsze światło potrafi wskazać drogę w ciemności.'],['Cisza','Nie każda cisza jest pustką. Czasem dojrzewają w niej najważniejsze słowa.'],['Bliskość','Czasem wystarczy obecność, by świat stał się odrobinę łagodniejszy.'],['Oddech','Nie musisz nieść całego jutra w dzisiejszym dniu.'],['Czułość','Niech Twoje słowa będą także schronieniem dla Ciebie.'],['Światło','Nie wszystkie gwiazdy widać od razu.'],['Odwaga','Mały krok też jest podróżą.'],['Spokój','Pozwól chwili być tylko chwilą.'],['Wolność','Możesz wybrać własny rytm.'],['Wdzięczność','Drobne rzeczy także zasługują na pamięć.']
],[['Afirmacja','Mam prawo odpoczywać.'],['Afirmacja','Moja wartość nie zależy od opinii innych.'],['Afirmacja','Mogę zaczynać od nowa.'],['Afirmacja','Zasługuję na szacunek i życzliwość.'],['Afirmacja','Nie muszę znać wszystkich odpowiedzi.'],['Afirmacja','Daję sobie czas na zmianę.'],['Afirmacja','Moje uczucia mają znaczenie.'],['Afirmacja','Mogę prosić o pomoc.'],['Afirmacja','Mam prawo do własnych granic.'],['Afirmacja','Doceniam każdy mały krok.']
