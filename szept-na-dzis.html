*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#192b48,#050b19 65%);color:#f4d99e;font:600 22px 'Cormorant Garamond',Georgia,serif;text-align:center;min-height:100vh}main{max-width:1000px;margin:auto;padding:20px}a{color:inherit}h1{font:clamp(54px,9vw,100px) 'Great Vibes',cursive;margin:10px 0;text-shadow:0 0 22px #dba44a77}.hero{width:100%;border-radius:18px;display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(6px,2vw,22px);margin:24px auto;max-width:780px}button{font:inherit;cursor:pointer;color:inherit}.cards button{padding:0;background:#0a1325;border:1px solid #c9a65e;border-radius:12px;overflow:hidden;transition:transform .3s,box-shadow .3s}.cards button:hover,.cards button:focus-visible{transform:translateY(-6px);box-shadow:0 0 28px #f6ce7788}.cards img{width:100%;display:block}.cards span{display:block;padding:8px;font-size:clamp(14px,2.5vw,24px)}.paper{background:radial-gradient(ellipse,#fff2d1,#dfbd83);color:#49301b;padding:30px 18px;border-radius:5px 14px 7px 12px;box-shadow:0 0 40px #d6a64c44;max-width:760px;margin:24px auto;min-height:170px}.paper h2{font:48px 'Great Vibes',cursive;margin:0}.paper p{font-size:26px;white-space:pre-line}.actions button,.actions a{display:inline-block;border:1px solid #b99a60;background:#121d31;border-radius:30px;padding:10px 20px;text-decoration:none;margin:5px}.flip{animation:flip .65s ease}.reveal{animation:reveal .65s ease}@keyframes flip{50%{transform:rotateY(90deg)}}@keyframes reveal{from{opacity:0;transform:perspective(800px) rotateX(-15deg)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}footer{padding:25px;font-size:17px}

</style></head><body><div class="dust" aria-hidden="true"></div><main><a href="./index.html">← Powrót do SZEPTU</a><h1>Szept na dziś</h1><p>Odnajdź słowa, których potrzebuje dziś Twoja dusza…</p><div class="cards"><button data-kind="0" aria-label="Słowo dnia"><img src="slowo.jpg" alt=""></button><button data-kind="1" aria-label="Afirmacja"><img src="afirmacja.jpg" alt=""></button><button data-kind="2" aria-label="Szept literatury"><img src="literatura.jpg" alt=""></button></div><article class="paper" aria-live="polite"><h2 id="heading">Otwórz kartę</h2><p id="message">Niektóre słowa odnajdują nas dokładnie wtedy, kiedy najbardziej ich potrzebujemy.</p><div id="author"></div></article><div class="actions" id="actions" hidden><button id="copy">Kopiuj słowa</button><a id="share" target="_blank" rel="noopener noreferrer">Udostępnij na Facebooku</a></div><p id="status" role="status"></p><footer>SZEPT — Twoje słowa. Czyjeś emocje.</footer></main><script>
const data=[[
['Nadzieja','Nawet najmniejsze światło potrafi wskazać drogę w ciemności.'],['Cisza','Nie każda cisza jest pustką. Czasem dojrzewają w niej najważniejsze słowa.'],['Bliskość','Czasem wystarczy obecność, by świat stał się odrobinę łagodniejszy.'],['Oddech','Nie musisz nieść całego jutra w dzisiejszym dniu.'],['Czułość','Niech Twoje słowa będą także schronieniem dla Ciebie.'],['Światło','Nie wszystkie gwiazdy widać od razu.'],['Odwaga','Mały krok też jest podróżą.'],['Spokój','Pozwól chwili być tylko chwilą.'],['Wolność','Możesz wybrać własny rytm.'],['Wdzięczność','Drobne rzeczy także zasługują na pamięć.']
],[['Afirmacja','Mam prawo odpoczywać.'],['Afirmacja','Moja wartość nie zależy od opinii innych.'],['Afirmacja','Mogę zaczynać od nowa.'],['Afirmacja','Zasługuję na szacunek i życzliwość.'],['Afirmacja','Nie muszę znać wszystkich odpowiedzi.'],['Afirmacja','Daję sobie czas na zmianę.'],['Afirmacja','Moje uczucia mają znaczenie.'],['Afirmacja','Mogę prosić o pomoc.'],['Afirmacja','Mam prawo do własnych granic.'],['Afirmacja','Doceniam każdy mały krok.']
],[['Szept literatury','Miej serce i patrzaj w serce!','Adam Mickiewicz — Romantyczność'],['Szept literatury','Litwo! Ojczyzno moja! ty jesteś jak zdrowie;','Adam Mickiewicz — Pan Tadeusz'],['Szept literatury','Chodzi mi o to, aby język giętki\nPowiedział wszystko, co pomyśli głowa.','Juliusz Słowacki — Beniowski'],['Szept literatury','Śpieszmy się kochać ludzi tak szybko odchodzą','Jan Twardowski — Śpieszmy się']]];
// Protected contemporary poetry is excluded pending permission.
data[2].pop(); data[2].splice(1,1);
data[0].push(...[["Tęsknota", "Nieobecność czasem ma kształt miejsca, które wciąż nosimy w sercu."], ["Ukojenie", "Niech dzisiejszy wieczór będzie brzegiem, do którego możesz spokojnie dopłynąć."], ["Zaufanie", "Nie musisz widzieć całej drogi, by zrobić kolejny krok."], ["Przebaczenie", "Możesz odłożyć ciężar, nawet jeśli przeszłość pozostanie niezmieniona."], ["Zachwyt", "Zatrzymaj wzrok na czymś małym, co zwykle umyka w pośpiechu."], ["Pamięć", "Niektóre chwile pozostają z nami jak ciepło zamknięte w dłoniach."], ["Wrażliwość", "Delikatność nie odbiera siły; pozwala dostrzec to, co kruche."], ["Cierpliwość", "Nie przyspieszaj wiosny w swoim sercu."], ["Obecność", "Dzisiejsza chwila nie potrzebuje doskonałości, tylko Twojej uwagi."], ["Początek", "Nawet niedokończona historia może otworzyć nowy rozdział."], ["Samotność", "W ciszy własnego towarzystwa możesz usłyszeć swój głos."], ["Równowaga", "Nie wszystko musi mieścić się w jednym dniu."], ["Marzenie", "Zostaw w swoim życiu miejsce na to, co jeszcze nie ma imienia."], ["Schronienie", "Niech Twoje własne słowa staną się dla Ciebie bezpiecznym miejscem."], ["Łagodność", "Nie każda droga wymaga walki. Niektóre wymagają troski."]]);
data[1].push(...[["Afirmacja", "Nie muszę dziś rozświetlać całego świata. Wystarczy, że zatroszczę się o własne światło."], ["Afirmacja", "Pozwalam sobie odpocząć, zanim zabraknie mi sił."], ["Afirmacja", "Mogę nosić w sercu wspomnienia i jednocześnie otwierać się na nowe chwile."], ["Afirmacja", "Nie muszę ukrywać swojej wrażliwości, by zasługiwać na szacunek."], ["Afirmacja", "Daję sobie przestrzeń na ciszę, na oddech i na własne tempo."], ["Afirmacja", "Moje granice są sposobem troszczenia się o siebie."], ["Afirmacja", "Mogę przeżywać trudny dzień bez osądzania siebie."], ["Afirmacja", "Nie muszę być wszystkim dla wszystkich."], ["Afirmacja", "Pozwalam sobie dostrzec piękno nawet w zwyczajnym dniu."], ["Afirmacja", "Moje marzenia zasługują na uwagę, nawet gdy jeszcze nie wiem, jak je spełnić."], ["Afirmacja", "Nie mierzę swojej wartości liczbą wykonanych zadań."], ["Afirmacja", "Mogę zmienić zdanie i wybrać inną drogę."], ["Afirmacja", "Daję sobie prawo do radości bez poczucia winy."], ["Afirmacja", "Przyjmuję własne emocje z cierpliwością."], ["Afirmacja", "Mogę prosić o bliskość, a także potrzebować samotności."], ["Afirmacja", "Nie muszę naprawiać całej przeszłości, aby zadbać o teraźniejszość."], ["Afirmacja", "Moje życie może rozwijać się w rytmie, który jest dla mnie dobry."], ["Afirmacja", "Pozwalam sobie na małe początki i niedoskonałe próby."], ["Afirmacja", "Mogę być dla siebie tak życzliwa lub życzliwy, jak dla bliskiej osoby."], ["Afirmacja", "Dzisiaj wybieram jeden mały gest troski o siebie."]]);
data[2].push(...[["Szept literatury", "Ciemno wszędzie, głucho wszędzie,\nCo to będzie, co to będzie?", "Adam Mickiewicz — Dziady, część II"], ["Szept literatury", "Jedźmy, nikt nie woła.", "Adam Mickiewicz — Stepy akermańskie"], ["Szept literatury", "Smutno mi, Boże!", "Juliusz Słowacki — Hymn"]]);
const dust=document.querySelector('.dust');for(let i=0;i<55;i++){const p=document.createElement('i');p.style.left=(i*37.17%100)+'%';p.style.top=(i*19.73%100)+'%';p.style.animationDelay=-(i%13)/2+'s';dust.appendChild(p);}

const last=[-1,-1,-1];let current='';const $=id=>document.getElementById(id);document.querySelectorAll('[data-kind]').forEach(b=>b.addEventListener('click',()=>{const k=Number(b.dataset.kind),a=data[k];let n=Math.floor(Math.random()*a.length);if(a.length>1&&n===last[k])n=(n+1)%a.length;last[k]=n;const [title,msg,author]=a[n];$('heading').textContent=title;$('message').textContent=msg;$('author').textContent=author||'Autorskie słowa SZEPTU';current=title+'\n'+msg+'\n'+$('author').textContent;b.classList.remove('flip');void b.offsetWidth;b.classList.add('flip');const paper=document.querySelector('.paper');paper.classList.remove('reveal');void paper.offsetWidth;paper.classList.add('reveal');$('actions').hidden=false;$('status').textContent='';$('share').href='https://www.facebook.com/sharer/sharer.php?u='+encodeURIComponent('https://mangel-r.github.io/szept/szept-na-dzis.html');}));$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(current);$('status').textContent='Skopiowano słowa.'}catch{$('status').textContent='Zaznacz tekst na pergaminie i skopiuj ręcznie.'}};
</script></body></html>
